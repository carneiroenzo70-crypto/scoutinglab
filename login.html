<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Connexion — VisionScore</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
  :root{
    --bg:#0E1422; --surf:#161E30; --border:rgba(140,165,205,.16);
    --text:#EAF0FA; --sub:#8A9BB8; --emerald:#1FB47A; --emerald-d:#159463;
    --emerald-glow:rgba(31,180,122,.25); --red:#FF5A4D;
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:radial-gradient(circle at 50% 0%,#16203a 0%,#0E1422 60%);
       font-family:'Helvetica Neue',Arial,sans-serif;color:var(--text);padding:1.5rem}
  .card{width:100%;max-width:380px;background:var(--surf);border:1px solid var(--border);
        border-radius:18px;padding:2.25rem 2rem;box-shadow:0 24px 60px rgba(0,0,0,.45)}
  .brand{text-align:center;margin-bottom:1.75rem}
  .brand .logo{font-size:1.5rem;font-weight:700;letter-spacing:-.02em}
  .brand .logo span{color:var(--emerald)}
  .brand .tag{font-family:'DM Mono',monospace;font-size:.7rem;letter-spacing:.18em;
              text-transform:uppercase;color:var(--sub);margin-top:.35rem}
  label{display:block;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;
        color:var(--sub);margin:0 0 .4rem .1rem}
  input[type=text],input[type=password]{width:100%;background:#0E1422;border:1px solid var(--border);
        border-radius:10px;padding:.7rem .85rem;color:var(--text);font-size:.95rem;
        font-family:inherit;transition:border .18s,box-shadow .18s;margin-bottom:1rem}
  input[type=text]:focus,input[type=password]:focus{outline:none;border-color:var(--emerald);
        box-shadow:0 0 0 3px var(--emerald-glow)}
  .remember{display:flex;align-items:center;gap:.5rem;margin:.25rem 0 1.25rem;
            font-size:.85rem;color:var(--sub);cursor:pointer}
  .remember input{accent-color:var(--emerald);width:16px;height:16px}
  button.submit{width:100%;background:var(--emerald);color:#04130C;border:none;border-radius:10px;
        padding:.8rem;font-size:.95rem;font-weight:700;letter-spacing:.02em;cursor:pointer;
        font-family:inherit;transition:transform .12s,filter .18s}
  button.submit:hover{filter:brightness(1.07)}
  button.submit:active{transform:scale(.985)}
  button.submit:disabled{opacity:.6;cursor:default}
  .msg{min-height:1.2rem;margin-top:.9rem;font-size:.82rem;text-align:center}
  .msg.error{color:var(--red)} .msg.ok{color:var(--emerald)}
  .back{display:block;text-align:center;margin-top:1.5rem;font-size:.8rem;color:var(--sub);
        text-decoration:none}
  .back:hover{color:var(--text)}
</style>
</head>
<body>
  <form class="card" id="login-form" autocomplete="on">
    <div class="brand">
      <div class="logo">Vision<span>Score</span></div>
      <div class="tag">Espace structures</div>
    </div>
    <label for="username">Identifiant</label>
    <input type="text" id="username" name="username" autocomplete="username" autofocus required/>
    <label for="password">Mot de passe</label>
    <input type="password" id="password" name="password" autocomplete="current-password" required/>
    <label class="remember"><input type="checkbox" id="remember" checked/> Rester connecté sur cet appareil</label>
    <button type="submit" class="submit" id="submit-btn">Se connecter</button>
    <div class="msg" id="msg"></div>
    <a class="back" href="/">← Retour à la présentation</a>
  </form>
<script>
  (function(){
    function b64urlDecode(s){ s=s.replace(/-/g,'+').replace(/_/g,'/'); while(s.length%4)s+='='; return atob(s); }
    var t = localStorage.getItem('vs_token') || sessionStorage.getItem('vs_token');
    if (t){ try{ var p=JSON.parse(b64urlDecode(t.split('.')[0])); if(p.exp && p.exp>Date.now()/1000) location.replace('/app'); }catch(e){} }
  })();
  var form = document.getElementById('login-form');
  var msg = document.getElementById('msg');
  var btn = document.getElementById('submit-btn');
  form.addEventListener('submit', async function(e){
    e.preventDefault();
    msg.className='msg'; msg.textContent='';
    var username = document.getElementById('username').value.trim();
    var password = document.getElementById('password').value;
    var remember = document.getElementById('remember').checked;
    if(!username || !password){ msg.className='msg error'; msg.textContent='Identifiant et mot de passe requis.'; return; }
    btn.disabled=true; btn.textContent='Connexion…';
    try{
      var res = await fetch('/api/login',{ method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ username:username, password:password, remember:remember }) });
      var data = await res.json();
      if(!res.ok){ throw new Error(data.error || 'Erreur de connexion'); }
      var store = remember ? localStorage : sessionStorage;
      store.setItem('vs_token', data.token);
      store.setItem('vs_user', JSON.stringify({ username:data.username, label:data.label }));
      msg.className='msg ok'; msg.textContent='Connecté ✓';
      location.replace('/app');
    }catch(err){
      msg.className='msg error'; msg.textContent = err.message;
      btn.disabled=false; btn.textContent='Se connecter';
    }
  });
</script>
</body>
</html>
