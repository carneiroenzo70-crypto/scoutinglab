<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="/assets/logos/favicon.svg">
<title>VisionScore — Redirection</title>
<script>
/* Page de connexion fusionnée dans la page de garde (/). On redirige :
   - déjà connecté → /app
   - sinon → / (qui contient le formulaire de connexion) */
(function(){
  function b64urlDecode(s){ s=s.replace(/-/g,'+').replace(/_/g,'/'); while(s.length%4)s+='='; return atob(s); }
  var t = localStorage.getItem('vs_token') || sessionStorage.getItem('vs_token');
  var authed = false;
  if (t) { try { var p = JSON.parse(b64urlDecode(t.split('.')[0])); authed = p.exp && p.exp > Date.now()/1000; } catch(e){} }
  location.replace(authed ? '/app' : '/#signin');
})();
</script>
</head>
<body></body>
</html>
